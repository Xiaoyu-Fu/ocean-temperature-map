<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAP 海水温度剖面查询</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --accent: #1769aa;
      --accent-soft: #e8f2fb;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      line-height: 1.55;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 22px 44px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 18px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.06);
    }
    label {
      display: block;
      margin: 0 0 6px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }
    input {
      width: 100%;
      height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      font: inherit;
      background: #fff;
    }
    .field { margin-bottom: 14px; }
    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: var(--accent);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.68;
    }
    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric {
      background: var(--accent-soft);
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 74px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .metric strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      line-height: 1.25;
    }
    .tables {
      display: grid;
      grid-template-columns: minmax(320px, 0.85fr) minmax(360px, 1.15fr);
      gap: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 8px 9px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; }
    th {
      color: #344054;
      background: #f8fafc;
      font-weight: 800;
    }
    .scroll {
      max-height: 520px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .scroll table th {
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .error {
      margin-top: 12px;
      color: var(--bad);
      font-weight: 700;
    }
    .empty {
      color: var(--muted);
      padding: 28px 0;
      text-align: center;
    }
    @media (max-width: 880px) {
      .layout, .tables, .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main>
  <h1>IAP 海水温度剖面查询</h1>
  <p class="sub">输入年月日和经纬度，查询 IAPv4.2 月平均绝对温度数据中最近网格的不同深度温度。当前接口按年月读取 NetCDF 文件。</p>

  <div class="layout">
    <section class="panel">
      <form id="lookup-form">
        <div class="field">
          <label for="date">日期</label>
          <input id="date" name="date" type="date" min="2020-01-01" max="2025-12-31" value="2025-08-15" required>
        </div>
        <div class="field">
          <label for="lat">纬度 / °N</label>
          <input id="lat" name="lat" type="number" step="0.0001" value="31.2304" required>
        </div>
        <div class="field">
          <label for="lon">经度 / °E</label>
          <input id="lon" name="lon" type="number" step="0.0001" value="121.4737" required>
        </div>
        <button id="submit" type="submit">查询温度剖面</button>
      </form>
      <p class="hint">IAP 文件是月平均数据，因此具体“日”不会改变结果，只用于选择对应年月。经度可输入 0-360 或 -180-180。</p>
      <div id="error" class="error"></div>
    </section>

    <section class="panel">
      <div id="empty" class="empty">输入位置后点击查询，结果会显示在这里。</div>
      <div id="result" hidden>
        <div class="summary" id="summary"></div>
        <div class="tables">
          <div>
            <h2 class="section-title">常用深度</h2>
            <div class="scroll">
              <table>
                <thead>
                  <tr><th>目标深度 / m</th><th>实际深度 / m</th><th>温度 / °C</th></tr>
                </thead>
                <tbody id="selected-body"></tbody>
              </table>
            </div>
          </div>
          <div>
            <h2 class="section-title">全标准深度剖面</h2>
            <div class="scroll">
              <table>
                <thead>
                  <tr><th>深度 / m</th><th>温度 / °C</th></tr>
                </thead>
                <tbody id="profile-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
  const form = document.querySelector("#lookup-form");
  const button = document.querySelector("#submit");
  const errorBox = document.querySelector("#error");
  const empty = document.querySelector("#empty");
  const result = document.querySelector("#result");
  const summary = document.querySelector("#summary");
  const selectedBody = document.querySelector("#selected-body");
  const profileBody = document.querySelector("#profile-body");

  function fmt(value, digits = 2) {
    return value === null || Number.isNaN(value) ? "缺测" : Number(value).toFixed(digits);
  }

  function metric(label, value) {
    return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
  }

  function row(cells) {
    return `<tr>${cells.map((cell) => `<td>${cell}</td>`).join("")}</tr>`;
  }

  function render(data) {
    const deepest = data.deepest_valid;
    summary.innerHTML = [
      metric("最近网格", `${data.nearest_grid.lat.toFixed(1)}°N, ${data.nearest_grid.lon.toFixed(1)}°E`),
      metric("距输入点", `${data.distance_km.toFixed(1)} km`),
      metric("有效深度层", `${data.valid_depth_count} 层`),
      metric("最深有效层", deepest ? `${deepest.depth_m.toFixed(0)} m / ${fmt(deepest.temperature_C)} °C` : "无有效值"),
    ].join("");

    selectedBody.innerHTML = data.selected_depths.map((item) => row([
      item.target_depth_m.toFixed(0),
      item.actual_depth_m.toFixed(0),
      fmt(item.temperature_C),
    ])).join("");

    profileBody.innerHTML = data.profile.map((item) => row([
      item.depth_m.toFixed(0),
      fmt(item.temperature_C),
    ])).join("");

    empty.hidden = true;
    result.hidden = false;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.textContent = "";
    button.disabled = true;
    button.textContent = "查询中...";
    try {
      const params = new URLSearchParams(new FormData(form));
      const response = await fetch(`/api/profile?${params.toString()}`);
      const data = await response.json();
      if (!data.ok) throw new Error(data.error || "查询失败");
      render(data);
    } catch (error) {
      errorBox.textContent = error.message;
    } finally {
      button.disabled = false;
      button.textContent = "查询温度剖面";
    }
  });
</script>
</body>
</html>
